{% extends "base.html" %}
{% block title %}Tambah Karyawan{% endblock %}

{% block content %}
<h2 class="fw-bold mb-4">Tambah Karyawan Gudang Baru</h2>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nama Lengkap</label>
                    <input type="text" class="form-control" name="full_name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email (untuk Login)</label>
                    <input type="email" class="form-control" name="email" required>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Password Awal</label>
                <input type="password" class="form-control" name="password" required minlength="6">
                <div class="form-text">Karyawan bisa mengubah password ini nanti.</div>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('gudang.employees') }}" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-primary">Simpan Karyawan</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
