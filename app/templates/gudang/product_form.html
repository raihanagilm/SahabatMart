{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Tambah' }} Produk{% endblock %}
{% block nav_title %}{{ 'Edit' if product else 'Tambah' }} Produk{% endblock %}

{% block content %}
<h2 class="mb-4">{{ 'Edit' if product else 'Tambah' }} Produk</h2>

<div class="card shadow-sm">
    <div class="card-body">
        <form method="POST" action="{{ url_for('gudang.edit_product', product_id=product.id) if product else url_for('gudang.add_product') }}">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="sku" class="form-label">SKU / Barcode</label>
                    <input type="text" class="form-control" id="sku" name="sku" value="{{ product.sku if product else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="name" class="form-label">Nama Produk</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ product.name if product else '' }}" required>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="price" class="form-label">Harga Jual</label>
                    <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ product.price if product else '' }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="category_id" class="form-label">Kategori</label>
                    <select class="form-select" id="category_id" name="category_id">
                        <option value="">-- Pilih Kategori --</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {{ 'selected' if product and product.category_id == cat.id else '' }}>{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a href="{{ url_for('gudang.products') }}" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-primary">Simpan Produk</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
